<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片壓縮 - 線上免費圖片壓縮工具</title>
<meta name="description" content="免費線上圖片壓縮，於瀏覽器本地透過 canvas 压缩 JPG／WebP，支援批次處理與品質調整，保護隱私不上傳。">
<meta name="keywords" content="圖片壓縮,壓縮圖片, JPG壓縮, WebP, 圖片縮小, 線上壓縮, image compressor">
<meta property="og:title" content="圖片壓縮 - 線上免費圖片壓縮工具">
<meta property="og:description" content="免費線上圖片壓縮，本地處理、支援批次與品質調整。">
<meta property="og:type" content="website">
<style>
  body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 24px; background: #f4f6f9; color: #222; }
  h1 { text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .dropzone {
    border: 2px dashed #b9c3d0; border-radius: 12px; padding: 40px 20px; text-align: center;
    background: #fff; cursor: pointer; transition: .15s; color: #555;
  }
  .dropzone:hover, .dropzone.dragover { border-color: #007bff; background: #f0f6ff; }
  .dropzone strong { display: block; font-size: 17px; margin-bottom: 6px; color: #333; }
  input[type=file] { display: none; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center;
    background: #fff; padding: 16px; border-radius: 10px; margin: 18px 0; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .controls label { font-weight: bold; font-size: 14px; }
  .controls select, .controls input[type=range] { vertical-align: middle; }
  .quality-val { display: inline-block; min-width: 34px; color: #007bff; font-weight: bold; }
  .btn {
    background: #007bff; color: #fff; border: none; padding: 10px 22px; border-radius: 6px;
    font-size: 15px; cursor: pointer; font-weight: bold;
  }
  .btn:hover { background: #0056b3; }
  .btn.secondary { background: #28a745; }
  .btn.secondary:hover { background: #218838; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 8px; }
  .card {
    background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.08);
    display: flex; flex-direction: column; gap: 8px;
  }
  .card img { width: 100%; height: 130px; object-fit: contain; border-radius: 6px; background: #fafafa; border: 1px solid #eee; }
  .meta { font-size: 12px; color: #666; line-height: 1.6; }
  .meta .orig { color: #999; text-decoration: line-through; }
  .meta .newc { color: #28a745; font-weight: bold; }
  .ratio { font-size: 12px; color: #007bff; font-weight: bold; }
  .card a.btn { display: inline-block; text-align: center; text-decoration: none; font-size: 13px; padding: 7px 0; }
  .empty-note { text-align: center; color: #999; margin: 20px 0; }
</style>
</head>
<body>

<div class="wrap">
  <h1>圖片壓縮</h1>
  <p class="subtitle">選擇品質與格式，批次壓縮圖片，全部於瀏覽器本地處理。</p>

  <div class="dropzone" id="dropzone">
    <strong>點擊選擇图片或拖曳到此處</strong>
    支援 JPG、PNG、WebP、GIF 等常見格式
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple>

  <div class="controls">
    <label>輸出格式：
      <select id="format">
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
      </select>
    </label>
    <label>品質：<span class="quality-val" id="qVal">70</span>%
      <input type="range" id="quality" min="1" max="100" value="70">
    </label>
    <button class="btn secondary" id="compressBtn" disabled>壓縮全部</button>
  </div>

  <div id="resultArea"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const qualityRange = document.getElementById('quality');
const qVal = document.getElementById('qVal');
const formatSelect = document.getElementById('format');
const compressBtn = document.getElementById('compressBtn');
const resultArea = document.getElementById('resultArea');

let items = []; // {id, file, src, origSize, width, height}

qualityRange.addEventListener('input', () => { qVal.textContent = qualityRange.value; });

dropzone.addEventListener('click', () => fileInput.click());
['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        items.push({ id: 'item_' + (items.length + 1) + '_' + Date.now(), file, src: e.target.result, origSize: file.size, width: img.width, height: img.height });
        renderList();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}

function renderList() {
  compressBtn.disabled = items.length === 0;
  if (items.length === 0) { resultArea.innerHTML = ''; return; }
  resultArea.innerHTML = '<h3 style="margin:18px 0 8px;">已上傳圖片</h3><div class="list"></div>';
  const grid = resultArea.querySelector('.list');
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = item.id;
    card.innerHTML = `
      <img src="${item.src}" alt="預覽">
      <div class="meta">
        <div>${item.file.name}</div>
        <div class="orig">${formatBytes(item.origSize)}</div>
        <div class="newc" data-size="">—</div>
        <div class="ratio" data-ratio=""></div>
      </div>
      <a class="btn secondary download" style="display:none;" download>下載壓縮結果</a>`;
    grid.appendChild(card);
  });
}

function compressOne(item, format, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = item.width;
      canvas.height = item.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(blob => resolve(blob), format, quality / 100);
    };
    img.src = item.src;
  });
}

compressBtn.addEventListener('click', async () => {
  const format = formatSelect.value;
  const quality = parseInt(qualityRange.value, 10);
  compressBtn.disabled = true;
  compressBtn.textContent = '壓縮中…';

  for (const item of items) {
    const blob = await compressOne(item, format, quality);
    item.compBlob = blob;
    item.compUrl = URL.createObjectURL(blob);
    const card = document.getElementById(item.id);
    card.querySelector('.newc').textContent = formatBytes(blob.size);
    const saved = 100 - (blob.size / item.origSize * 100);
    card.querySelector('.ratio').textContent = '節省 ' + saved.toFixed(1) + '%';
    const dl = card.querySelector('.download');
    dl.href = item.compUrl;
    const ext = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
    dl.download = 'compressed_' + item.file.name.replace(/\.[^.]+$/, '') + '.' + ext;
    dl.style.display = 'inline-block';
  }

  compressBtn.disabled = false;
  compressBtn.textContent = '壓縮全部';
});
</script>

</body>
</html>

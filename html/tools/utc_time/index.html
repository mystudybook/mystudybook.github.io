<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script
  src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
  crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<title>UTC to Local Time Converter</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h2 {
    color: #333;
  }
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }
  input[type="button"] {
    padding: 10px 20px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  input[type="button"]:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>

<h2>UTC to Local Time Converter</h2>
<form>
  <label for="utcTime">Select UTC Time:</label>
  <input type="datetime-local" id="utcTime">
  
  <label for="timeZone">Search and Select Time Zone:</label>
  <select id="timeZone" onchange="updateLocalTime()">
    <option value="">Please select time zone</option>
    <optgroup label="Asia">
      <option value="Asia/Taipei">台北 (Taipei)</option>
      <option value="Asia/Shanghai">上海 (Shanghai)</option>
      <option value="Asia/Hong_Kong">香港 (Hong Kong)</option>
      <option value="Asia/Tokyo">東京 (Tokyo)</option>
      <option value="Asia/Singapore">新加坡 (Singapore)</option>
      <option value="Asia/Bangkok">曼谷 (Bangkok)</option>
      <option value="Asia/Kolkata">德里 (Kolkata)</option>
      <option value="Asia/Dubai">杜拜 (Dubai)</option>
    </optgroup>
    <optgroup label="Europe">
      <option value="Europe/London">倫敦 (London)</option>
      <option value="Europe/Paris">巴黎 (Paris)</option>
      <option value="Europe/Berlin">柏林 (Berlin)</option>
      <option value="Europe/Frankfurt">法蘭克福 (Frankfurt)</option>
      <option value="Europe/Madrid">馬德里 (Madrid)</option>
      <option value="Europe/Rome">羅馬 (Rome)</option>
      <option value="Europe/Moscow">莫斯科 (Moscow)</option>
    </optgroup>
    <optgroup label="America">
      <option value="America/New_York">紐約 (New York)</option>
      <option value="America/Chicago">芝加哥 (Chicago)</option>
      <option value="America/Denver">丹佛 (Denver)</option>
      <option value="America/Los_Angeles">洛杉磯 (Los Angeles)</option>
      <option value="America/Vancouver">溫哥華 (Vancouver)</option>
      <option value="America/Toronto">多倫多 (Toronto)</option>
      <option value="America/Mexico_City">墨西哥城 (Mexico City)</option>
      <option value="America/Sao_Paulo">聖保羅 (Sao Paulo)</option>
    </optgroup>
    <optgroup label="Africa">
      <option value="Africa/Cairo">開羅 (Cairo)</option>
      <option value="Africa/Johannesburg">約翰尼斯堡 (Johannesburg)</option>
      <option value="Africa/Nairobi">內羅比 (Nairobi)</option>
      <option value="Africa/Lagos">拉哥斯 (Lagos)</option>
      <option value="Africa/Casablanca">卡薩布蘭卡 (Casablanca)</option>
    </optgroup>
    <optgroup label="Australia/Oceania">
      <option value="Australia/Sydney">悉尼 (Sydney)</option>
      <option value="Australia/Melbourne">墨爾本 (Melbourne)</option>
      <option value="Australia/Perth">柏斯 (Perth)</option>
      <option value="Pacific/Auckland">奧克蘭 (Auckland)</option>
    </optgroup>
  </select>
  
  <label for="localTime">Local Time:</label>
  <input type="text" id="localTime" readonly>
  
  <input type="button" value="Convert" onclick="updateLocalTime()">
</form>

<script>

$(document).ready(function() {
    $('#timeZone').select2();
});

function updateLocalTime() {
  var utcTimeStr = document.getElementById('utcTime').value;
  var timeZone = document.getElementById('timeZone').value;
  
  // Validate input
  if (!utcTimeStr.trim() || !timeZone.trim()) {
    alert('Please select UTC time and time zone.');
    return;
  }
  
  // Convert UTC time to local time
  var utcTime = new Date(utcTimeStr);
  var options = {timeZone: timeZone, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric'};
  var localTime = utcTime.toLocaleString('en-US', options);
  
  // Display local time
  document.getElementById('localTime').value = localTime;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密碼產生器 - 高强度随机密码生成</title>
<meta name="description" content="免費密碼產生器，可生成长度与字元类型可调的随机强密码，含强度指示与一键复制，使用浏览器加密随机数，安全可靠。">
<meta name="keywords" content="密碼產生器,密碼生成,強密碼,隨機密碼,高强度密码,Password Generator">
<meta property="og:title" content="密碼產生器 - 高强度随机密码生成">
<meta property="og:description" content="免費密碼產生器，可生成长度与字元类型可调的随机强密码，含强度指示与一键复制。">
<meta property="og:type" content="website">
<style>
  body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  .container { max-width: 680px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  label { display: block; margin: 12px 0 6px; font-weight: bold; }
  .pw-display {
    display: flex; align-items: center; gap: 8px; background: #f4f6f9;
    border: 1px solid #ccc; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 18px;
  }
  .pw-display #password { flex: 1; word-break: break-all; min-height: 24px; }
  button { display: block; width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; cursor: pointer; margin-top: 12px; }
  .primary { background-color: #007bff; color: #fff; border: none; }
  .primary:hover { background-color: #0056b3; }
  .secondary { background-color: #fff; color: #333; }
  .secondary:hover { background-color: #eee; }
  .checkbox-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
  .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; margin: 0; }
  .checkbox-group input { width: auto; }
  input[type=range] { width: 100%; }
  .length-val { font-weight: bold; color: #007bff; }
  .strength-bar { height: 10px; border-radius: 5px; background: #e0e0e0; margin-top: 8px; overflow: hidden; }
  .strength-fill { height: 100%; width: 0; transition: width .2s, background .2s; }
  .strength-text { text-align: center; font-size: 13px; margin-top: 4px; }
  .disclaimer { color: #b00; margin-top: 16px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<h1>密碼產生器<small style="display:block;font-size:14px;color:#666;font-weight:normal;">Strong Password Generator</small></h1>

<div class="container">
  <label for="password">產生的密碼：</label>
  <div class="pw-display">
    <span id="password"></span>
  </div>
  <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
  <div class="strength-text" id="strengthText">強度：</div>

  <label>長度：<span class="length-val" id="lengthVal">16</span></label>
  <input type="range" id="length" min="4" max="64" value="16" oninput="onLengthChange()">

  <label>字元類型：</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="lower" checked> 小寫字母 a-z</label>
    <label><input type="checkbox" id="upper" checked> 大寫字母 A-Z</label>
    <label><input type="checkbox" id="digits" checked> 數字 0-9</label>
    <label><input type="checkbox" id="symbols"> 符號 !@#$%^&*</label>
  </div>
  <label><input type="checkbox" id="ambiguous"> 排除易混淆字元（0,O,1,l,I,.）</label>

  <button class="primary" onclick="generate()">重新產生密碼</button>
  <button class="secondary" onclick="copyPassword()">複製密碼</button>

  <div class="disclaimer">本工具在瀏覽器本地生成密碼，不會上傳或記錄任何資料。建議用於重要帳號的密碼。</div>
</div>

<script>
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const DIGITS = '0123456789';
const SYMBOLS = '!@#$%^&*()-_=+[]{};:,.<>?';
const AMBIGUOUS = '0O1lI.';

function secureRandom(max) {
  const array = new Uint32Array(1);
  crypto.getRandomValues(array);
  return array[0] % max;
}

function buildCharset() {
  let chars = '';
  if (document.getElementById('lower').checked) chars += LOWER;
  if (document.getElementById('upper').checked) chars += UPPER;
  if (document.getElementById('digits').checked) chars += DIGITS;
  if (document.getElementById('symbols').checked) chars += SYMBOLS;
  if (document.getElementById('ambiguous').checked) {
    chars = [...chars].filter(c => !AMBIGUOUS.includes(c)).join('');
  }
  return chars;
}

function generate() {
  const length = parseInt(document.getElementById('length').value, 10);
  const charset = buildCharset();
  if (!charset) { alert('請至少選擇一種字元類型。'); return; }

  let pw = '';
  // 保證每種選中字元至少出現一次
  const selectedTypes = [];
  if (document.getElementById('lower').checked) selectedTypes.push(LOWER);
  if (document.getElementById('upper').checked) selectedTypes.push(UPPER);
  if (document.getElementById('digits').checked) selectedTypes.push(DIGITS);
  if (document.getElementById('symbols').checked) selectedTypes.push(SYMBOLS);

  const chars = [...charset];
  for (let i = 0; i < length; i++) {
    if (i < selectedTypes.length) {
      const pool = [...chars].filter(c => selectedTypes.some(t => t.includes(c)));
      pw += pool[secureRandom(pool.length)];
    } else {
      pw += chars[secureRandom(chars.length)];
    }
  }
  // 洗牌，避免前置固定模式
  const arr = pw.split('');
  for (let i = arr.length - 1; i > 0; i--) {
    const j = secureRandom(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  pw = arr.join('');
  document.getElementById('password').textContent = pw;
  updateStrength(pw);
}

function updateStrength(pw) {
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (pw.length >= 16) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/\d/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;

  let width, label, color;
  if (score <= 2) { width = '33%'; label = '弱'; color = '#dc3545'; }
  else if (score <= 4) { width = '66%'; label = '中等'; color = '#ffc107'; }
  else { width = '100%'; label = '強'; color = '#28a745'; }

  const fill = document.getElementById('strengthFill');
  fill.style.width = width;
  fill.style.background = color;
  document.getElementById('strengthText').textContent = '強度：' + label;
}

function onLengthChange() {
  document.getElementById('lengthVal').textContent = document.getElementById('length').value;
  generate();
}

function copyPassword() {
  const pw = document.getElementById('password').textContent;
  if (!pw) { alert('請先產生密碼。'); return; }
  navigator.clipboard.writeText(pw).then(() => alert('已複製密碼。')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = pw; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    alert('已複製密碼。');
  });
}

window.addEventListener('load', generate);
</script>

</body>
</html>

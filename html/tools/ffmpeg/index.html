<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="免費線上 MP3 轉換器，將音頻檔案轉換為高品質 MP3，支援多種比特率選擇，全部於瀏覽器本地處理。">
<meta name="keywords" content="MP3 轉換器, 音頻轉換, 音頻轉 MP3, 音樂轉換, 在線 MP3 轉換, audio to mp3">
<meta property="og:title" content="在線 MP3 轉換器">
<meta property="og:description" content="免費將音頻檔案轉換為 MP3，支援多種音質選項，本地處理保護隱私。">
<meta property="og:type" content="website">
<script src="./lame.min.js"></script>
<style>
  body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 24px; margin: 0; }
  h1 { color: #333; }
  .container { background: white; max-width: 460px; margin: auto; padding: 26px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  label { font-weight: bold; margin-top: 14px; display: block; }
  select, input[type=file], button { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
  button { background-color: #007BFF; color: white; border: none; margin-top: 18px; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #0056b3; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  audio { width: 100%; margin-top: 16px; }
  a#downloadLink { display:none; text-decoration:none; font-weight:bold; color:#28a745; margin-top:14px; display:block; }
  a#downloadLink:hover { color:#1e7e34; }
  #message { font-size: 14px; color: #555; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>

<div class="container">
  <h1>MP3 轉換器</h1>

  <label for="uploader">請選擇您要轉換的音頻檔案（JPG／PNG 圖片除外）</label>
  <input type="file" id="uploader" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac,.wma">

  <label for="bitrate">目標比特率：</label>
  <select id="bitrate">
    <option value="128">128 kbps</option>
    <option value="192" selected>192 kbps</option>
    <option value="256">256 kbps</option>
    <option value="320">320 kbps</option>
  </select>

  <audio id="output" controls style="display:none;"></audio>
  <button id="convertBtn">轉換為 MP3</button>
  <a id="downloadLink">下載 MP3</a>
  <p id="message"></p>
</div>

<script>
const uploader = document.getElementById('uploader');
const bitrateSel = document.getElementById('bitrate');
const convertBtn = document.getElementById('convertBtn');
const outputAudio = document.getElementById('output');
const downloadLink = document.getElementById('downloadLink');
const messageEl = document.getElementById('message');

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

uploader.addEventListener('change', () => { downloadLink.style.display='none'; outputAudio.style.display='none'; messageEl.textContent=''; });

convertBtn.addEventListener('click', async () => {
  const file = uploader.files[0];
  if (!file) { messageEl.textContent = '請先選擇音頻檔案。'; return; }
  convertBtn.disabled = true;
  messageEl.textContent = '讀取檔案中…';

  try {
    const arrayBuf = await file.arrayBuffer();
    const ctx = getAudioContext();
    messageEl.textContent = '解碼音訊中…';
    // 解碼為 PCM（支援瀏覽器可播放的音頻格式）
    const audioBuf = await ctx.decodeAudioData(arrayBuf);

    messageEl.textContent = '轉錄成 MP3 中…';
    const channels = audioBuf.numberOfChannels;
    const sampleRate = audioBuf.sampleRate;
    const kbps = parseInt(bitrateSel.value, 10);

    const encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
    const left = audioBuf.getChannelData(0);
    const right = channels > 1 ? audioBuf.getChannelData(1) : null;

    const mp3Chunks = [];
    const chunkSize = 1152;
    const total = left.length;
    for (let i = 0; i < total - chunkSize; i += chunkSize) {
      const mp3data = encoder.encodeBuffer(
        left.slice(i, i + chunkSize),
        right ? right.slice(i, i + chunkSize) : null
      );
      mp3Chunks.push(mp3data);
    }
    const tail = encoder.encodeBuffer(
      left.slice(total - (total % chunkSize || chunkSize)),
      right ? right.slice(total - (total % chunkSize || chunkSize)) : null
    );
    mp3Chunks.push(tail);
    mp3Chunks.push(encoder.flush());

    const mp3Blob = new Blob(mp3Chunks, { type: 'audio/mp3' });
    const url = URL.createObjectURL(mp3Blob);

    outputAudio.src = url;
    outputAudio.style.display = 'block';

    const base = file.name.replace(/\.[^.]+$/, '');
    downloadLink.href = url;
    downloadLink.download = base + '.mp3';
    downloadLink.textContent = '下載 MP3';
    downloadLink.style.display = 'block';

    const sizeMB = (mp3Blob.size / 1024 / 1024).toFixed(2);
    messageEl.textContent = '轉換完成！大小：' + sizeMB + ' MB';
    convertBtn.disabled = false;
  } catch (err) {
    messageEl.textContent = '轉換失敗：不支援的音頻格式或檔案損毀（' + err.message + '）。';
    convertBtn.disabled = false;
  }
});
</script>

</body>
</html>
